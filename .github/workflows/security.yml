name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  npm-audit:
    name: npm audit (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Audit high+critical (production deps only)
        # Known unfixable vulnerabilities with no upstream fix available:
        #   (none remaining — google-tts-api, parquetjs, gtts removed 2026-06)
        # Re-run `npm audit --audit-level=high --omit=dev` to verify clean.
        run: npm audit --audit-level=high --omit=dev

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required by gitleaks-action to post scan results as PR comments
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-fs:
    name: trivy (filesystem + misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Trivy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy_dir="$RUNNER_TEMP/trivy-release"
          mkdir -p "$trivy_dir"
          gh release download v0.70.0 --repo aquasecurity/trivy --pattern trivy_0.70.0_Linux-64bit.tar.gz --dir "$trivy_dir"
          printf '%s  %s\n' '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9' "$trivy_dir/trivy_0.70.0_Linux-64bit.tar.gz" | sha256sum --check -
          tar -xzf "$trivy_dir/trivy_0.70.0_Linux-64bit.tar.gz" -C "$trivy_dir" trivy
          echo "$trivy_dir" >> "$GITHUB_PATH"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.70.0
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          skip-dirs: "node_modules,dist,dev-dist,scripts/archive"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-fs"
