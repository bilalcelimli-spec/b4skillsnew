name: Data Retention Inventory

# KVKK m.7 / GDPR Art.5(1)(e) — "storage limitation" principle.
# Runs weekly on Monday 03:00 UTC (after Sunday backup completes).
on:
  schedule:
    - cron: "0 3 * * 1"   # Her Pazartesi 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kuru çalıştırma (veritabanına yazmadan simüle et)"
        type: boolean
        default: true

jobs:
  enforce-retention:
    name: Preview Data Retention Inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Preview retention inventory
        id: retention
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INTERNAL_API_SECRET" ]; then
            echo "APP_URL and INTERNAL_API_SECRET are required"
            exit 1
          fi
          echo "Previewing data retention inventory (dryRun=$DRY_RUN)..."

          RESPONSE=$(curl --connect-timeout 10 --max-time 60 -A "B4skillsOps/1.0" -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\": $DRY_RUN}" \
            "${APP_URL%/}/api/admin/data-retention/run?dry=$([ "$DRY_RUN" = "true" ] && echo 1 || echo 0)")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          printf '%s\n' "$BODY" > retention-output.txt
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Retention inventory failed with HTTP $HTTP_CODE"
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('retention-output.txt', 'utf8'));
          if (report.dryRun !== true || report.enforced !== false || !report.inventory ||
              !['expiredSessions', 'expiredAudioReferences', 'openReviews'].every(key => Number.isInteger(report.inventory[key]) && report.inventory[key] >= 0)) {
            throw new Error('Invalid retention inventory response');
          }
          JS

      - name: Upload retention log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-retention-log-${{ github.run_number }}
          path: retention-output.txt
          retention-days: 365

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Data Retention Inventory Failed — ${new Date().toISOString().split('T')[0]}`,
              body: `
              ## Data Retention Inventory Failure

              **Date:** ${new Date().toISOString()}
              **Dry Run:** ${{ github.event.inputs.dry_run || 'true' }}
              **Workflow run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

              ### KVKK / GDPR Compliance Risk

              The read-only retention inventory failed. No retention enforcement is implemented.
              Resolve the two-year/five-year policy conflict and storage/legal-hold handling before implementing deletion.

              **Retention schedules at risk:**
              - Ses dosyaları: 90 gün sonra silinmeli
              - Sınav oturumları: 5 yıl sonra anonimleştirilmeli

              ### Action Required

              1. Check workflow logs
              2. Verify \`APP_URL\` and \`INTERNAL_API_SECRET\` secrets
              3. Preview manually: \`POST /api/admin/data-retention/run?dry=1\`
              4. Document in compliance log if > 7 days late

              /cc @bilalcelimli-spec
              `,
              labels: ['compliance', 'kvkk', 'gdpr', 'critical'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## Data Retention Inventory" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Date | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ github.event.inputs.dry_run || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | ${{ steps.retention.outputs.http_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Inventory only; no deletion or anonymisation is performed. Retention enforcement is not implemented.**" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow policy assumptions (require resolution against legacy policy):**" >> $GITHUB_STEP_SUMMARY
          echo "- Ses dosyaları: 90 gün" >> $GITHUB_STEP_SUMMARY
          echo "- Sınav oturumları: 5 yıl (sonra anonimleştirme)" >> $GITHUB_STEP_SUMMARY
          echo "- Teknik günlükler: 1 yıl (server log rotation)" >> $GITHUB_STEP_SUMMARY
