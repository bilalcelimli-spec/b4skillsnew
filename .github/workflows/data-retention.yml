name: Data Retention
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (false requires production RETENTION_APPLY_ENABLED)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: data-retention
  cancel-in-progress: false
jobs:
  retention:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run paginated retention and retry storage deletions
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || format('{0}', vars.RETENTION_APPLY_ENABLED != 'true') }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INTERNAL_API_SECRET" ]; then
            echo "::error::Configure APP_URL and INTERNAL_API_SECRET in the GitHub production environment. No retention requests were sent."
            exit 1
          fi
          node scripts/jobs/retention-http.mjs
