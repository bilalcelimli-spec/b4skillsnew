name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - name: Check active UI API routes
        run: npm run audit:routes

  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Vitest (psychometric engine)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/b4skills_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b4skills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Prepare isolated test database
        run: |
          npm run db:migrate
          npm run db:seed:ci
      - name: Run psychometric test suite
        run: npm test
      - name: Coverage report
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  seed-quality:
    name: Seed Quality Gate (Vocabulary)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Validate vocab seed integrity and semantic image rules
        run: npm run quality:vocab

  # ─────────────────────────────────────────────────────────────────────────────
  item-validation:
    name: Item Validation Gate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/b4skills_items
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b4skills_items
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Prepare isolated item-bank database
        run: |
          npm run db:migrate
          npm run db:seed:ci
      - name: Validate item schemas and structure
        run: npm run validate:items:strict
      - name: Verify skill-coverage per profile
        # Critical now that WRITING/SPEAKING are mandatory in every product
        # line — a gap in productive items would silently downgrade the
        # user's exam. Fails the build if any profile × skill × CEFR cell
        # has fewer than `minItems` ACTIVE items.
        run: npm run verify:coverage
        continue-on-error: false
      - name: Verify IRT health (no zero-information items)
        # An ACTIVE item with discrimination a ≤ 0 produces zero Fisher
        # information and is invisible to the MFI-based CAT selector, silently
        # degrading adaptivity. Fails the build if any such item exists.
        run: npm run verify:irt
        continue-on-error: false
      - name: Report empirical calibration readiness
        # This is intentionally informational while the bank is in cold start.
        # Release approval must run `npm run verify:irt:production`, which
        # requires at least 80% of ACTIVE items to be calibrated on responses.
        run: npm run verify:irt:production
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Vite + Server)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build Vite frontend
        run: npm run build
      - name: Bundle Express server
        run: npm run build:server
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [type-check, test, seed-quality, item-validation, build]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
