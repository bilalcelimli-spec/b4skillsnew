# render.yaml — Render.com Infrastructure as Code
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: linguadapt-app
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_URL
        sync: false          # Supabase session-pooler URL (5432), configured securely
      - key: MIGRATION_DATABASE_URL
        sync: false          # Supabase direct/session-pooler URL, never transaction mode
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: https://yodlirkepgdazryfxdae.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false          # server-only secret; never VITE_ / public
      - key: IDENTITY_SNAPSHOT_BUCKET
        value: identity-snapshots
      - key: PROCTORING_EVIDENCE_BUCKET
        value: proctoring-evidence
      - key: DATA_WAREHOUSE_BUCKET
        value: data-exports
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: linguadapt-app
          property: host

# Existing Render database is intentionally not removed from this blueprint.
# Retain it for rollback until the Supabase migration has been verified.
databases:
  - name: linguadapt-db
    databaseName: linguadapt
    user: linguadapt
    plan: starter
    region: oregon
